# no replicas here - KEDA controls the number of workers
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-worker
  labels:
    app: weather-worker
spec:
  selector:
    matchLabels:
      app: weather-worker
  template:
    metadata:
      labels:
        app: weather-worker
    spec:
      containers:
        - name: weather-worker
          image: ormano/weatherapp
          command: ["python", "-m", "app.worker"]
          env:
            - name: WEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-api-secret
                  key: api-key
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: url
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
