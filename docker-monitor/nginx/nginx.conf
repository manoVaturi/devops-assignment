server {
    listen 80 default_server;
    server_name _;

    # behind the ALB the peer is the load balancer: take the client IP from the
    # last X-Forwarded-For entry, but only when the request comes from the VPC
    set_real_ip_from 172.31.0.0/16;   # default VPC
    real_ip_header X-Forwarded-For;

    # one location only: a second one would drop the proxy_set_header lines
    location / {
        proxy_pass http://docker-monitor:5000;

        # replaces any X-Source-IP sent by the client ($remote_addr is the real client IP)
        proxy_set_header X-Source-IP $remote_addr;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
